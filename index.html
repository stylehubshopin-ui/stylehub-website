<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Style Hub | Premium Men's Fashion</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <header class="navbar">
    <div class="logo">STYLE HUB</div>
    <nav>
      <a href="#">Home</a>
      <a href="#products">Products</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <!-- HERO -->
  <section class="hero">
    <h1>Premium Men's Fashion</h1>
    <p>Luxury suits, shirts & trousers for modern men</p>
    <a href="#products" class="btn">Shop Now</a>
  </section>

  <!-- PRODUCTS -->
  <section id="products" class="products">
    <h2>Featured Collection</h2>

    <div class="product-grid">
      <div class="card">
        <h3>Formal Suit</h3>
        <p class="price">₹4999</p>
        <button>Add to Cart</button>
      </div>

      <div class="card">
        <h3>Stylish Shirt</h3>
        <p class="price">₹1999</p>
        <button>Add to Cart</button>
      </div>

      <div class="card">
        <h3>Casual Trouser</h3>
        <p class="price">₹2499</p>
        <button>Add to Cart</button>
      </div>
    </div>
  </section>

  <!-- CONTACT -->
  <section id="contact" class="contact">
    <h2>Contact Us</h2>
    <p>📞 8318337618</p>
    <p>📧 stylehub.store.in@gmail.com</p>
  </section>

  <!-- FOOTER -->
  <footer>
    <p>© 2026 Style Hub. All rights reserved.</p> 
  </footer>

</body>
</html>
