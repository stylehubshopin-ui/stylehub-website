<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Style Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #f6f6f6;
    }

    /* TOP OFFER BAR */
    .offer-bar {
      background: #000;
      color: #fff;
      font-size: 12px;
      text-align: center;
      padding: 6px;
    }

    /* HEADER */
    .header {
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      border-bottom: 1px solid #ddd;
    }

    .menu {
      font-size: 22px;
    }

    .logo {
      font-weight: 700;
      font-size: 20px;
      color: #d4af37; /* GOLD */
    }

    .icons {
      font-size: 20px;
    }

    /* CATEGORIES */
    .categories {
      display: flex;
      overflow-x: auto;
      background: #fff;
      padding: 10px 0;
    }

    .cat {
      text-align: center;
      min-width: 80px;
      font-size: 12px;
    }

    .cat img {
      width: 60px;
      height: 60px;
      border-radius: 10px;
      object-fit: cover;
    }

    /* BANNER */
    .banner {
      position: relative;
      margin: 10px;
    }

    .banner img {
      width: 100%;
      border-radius: 10px;
    }

    .banner-text {
      position: absolute;
      bottom: 20px;
      left: 20px;
      color: #fff;
    }

    .banner-text h1 {
      margin: 0;
      font-size: 26px;
    }

    .banner-text p {
      margin: 5px 0;
    }

    .banner-text button {
      background: #f5c400;
      border: none;
      padding: 10px 18px;
      font-weight: 600;
      border-radius: 6px;
    }

    /* PRODUCTS */
    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 10px;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }

    .card img {
      width: 100%;
      border-radius: 10px;
    }

    .price {
      font-weight: 600;
    }
